services:
  melecho:
    image: ghcr.io/rusaell/melecho:latest
    build: .
    container_name: melecho
    restart: on-failure
    ports:
      - "127.0.0.1:8765:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - melecho_data:/root/.local/share/melecho
      - melecho_config:/root/.config/melecho
      # Положите SSH-ключи в ./ssh рядом с docker-compose.yml (в UI путь: /root/.ssh/id_ed25519)
      # Либо укажите путь к ключу хоста, например ~/.ssh:/root/.ssh:ro (Linux) или C:/Users/Имя/.ssh:/root/.ssh:ro (Windows)
      - ./ssh:/root/.ssh:ro
    stop_signal: SIGTERM
    stop_grace_period: 10s

volumes:
  melecho_data:
  melecho_config:
