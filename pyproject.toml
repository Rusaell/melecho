[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "melecho"
version = "1.1.0"
description = "Local-first Linux SSH control panel with HMAC audit and LLM-assisted anomaly interpretation"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Rusaell" }]
keywords = ["ssh", "monitoring", "sysadmin", "local-first", "audit", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Systems Administration",
  "Topic :: System :: Monitoring",
]

# Нижние границы — протестированные версии (см. STATE.md, раздел
# «Зависимости»). Верхние — защита от breaking major при автообновлении:
# pip install -e . не поставит, например, FastAPI 1.0 с ломающими
# изменениями. Периодическая проверка — `pip-audit` (см. dev-зависимости).
dependencies = [
  "fastapi>=0.140,<1.0",
  "uvicorn[standard]>=0.50,<1.0",
  "cryptography>=50,<51",
  "argon2-cffi>=25,<26",
  "pyyaml>=6.0,<7",
  "httpx>=0.28,<1.0",
  "asyncssh>=2.24,<3.0",
  "bcrypt>=5.0,<6",
  "python-multipart>=0.0.9,<1.0",
]

[project.urls]
Repository = "https://github.com/Rusaell/melecho"
Issues = "https://github.com/Rusaell/melecho/issues"

[project.optional-dependencies]
# pip-audit: проверка известных CVE по установленным пакетам.
# Запуск: .venv/bin/pip-audit --desc
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pip-audit>=2.10", "pyflakes>=3.2"]

[project.scripts]
melecho = "melecho.__main__:main"

# src-layout (PyPA). Пакет — src/melecho/. Ресурсы внутри пакета
# (static/, catalog/, resources/) включаются через package-data.
[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
melecho = ["catalog/*.yaml", "static/**/*", "resources/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.mypy]
python_version = "3.11"
packages = ["melecho"]
ignore_missing_imports = true
